<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote builder — demo_test652</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main>
  <h1>Quote builder</h1>
  <p class="lede">Pick some items, set a discount, see what the customer pays.</p>

  <section class="card">
    <div id="items">Loading…</div>
  </section>

  <section class="card">
    <label class="control" for="discount">Discount %</label>
    <input id="discount" type="number" min="0" max="100" step="1" value="10">
    <p class="hint">Applied to the subtotal. Tax is charged on what's left.</p>
  </section>

  <section class="card">
    <div class="row"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
    <div class="row discount"><span>Discount</span><span id="discountAmount">$0.00</span></div>
    <div class="row"><span>Tax (10%)</span><span id="tax">$0.00</span></div>
    <div class="row row--total"><span>Total</span><span id="total">$0.00</span></div>
    <p class="warning" id="minimum" hidden></p>
  </section>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
